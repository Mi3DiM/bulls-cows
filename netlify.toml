# Netlify deployment.
#
# The game is a static site: `npm run build` produces `dist/`, and that
# folder is the whole application. There is no server, no function and no
# environment variable to set.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 22.15 or newer: jsdom pulls in undici, which needs
  # zlib.createZstdDecompress (added in Node 22.15).
  NODE_VERSION = "24.16.0"

# A single-page app: every path that is not a real file falls back to
# index.html, so a shared link like /?room=K7P4 always loads.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
